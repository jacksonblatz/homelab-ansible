---
- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  check_mode: false

- name: List upgradable packages
  ansible.builtin.command:
    argv:
      - apt-get
      - --just-print
      - --quiet
      - upgrade
  register: guarded_patch_check
  changed_when: false
  check_mode: false

- name: Count pending package updates
  ansible.builtin.set_fact:
    guarded_patch_pending: "{{ guarded_patch_check.stdout_lines | select('match', '^Inst ') | list | length }}"

- name: Report pending updates
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} has {{ guarded_patch_pending }} pending
      package update(s). guarded_patch_apply={{ guarded_patch_apply }}.

- name: Refuse a large unattended batch
  ansible.builtin.fail:
    msg: >-
      {{ guarded_patch_pending }} pending updates exceeds
      guarded_patch_max_packages={{ guarded_patch_max_packages }}.
      Re-run with -e guarded_patch_allow_large_batch=true if you have reviewed the set.
  when:
    - guarded_patch_apply | bool
    - not (guarded_patch_allow_large_batch | bool)
    - (guarded_patch_pending | int) > (guarded_patch_max_packages | int)

- name: Apply available package updates
  ansible.builtin.apt:
    upgrade: dist
  when: guarded_patch_apply | bool
  register: guarded_patch_apply_result

- name: Check whether a reboot is required
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: guarded_patch_reboot_file

- name: Set reboot_required
  ansible.builtin.set_fact:
    guarded_patch_reboot_required: "{{ guarded_patch_reboot_file.stat.exists }}"

- name: Report a needed reboot without performing it
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} requires a reboot.
      It will not be rebooted unless you pass -e guarded_patch_reboot=true.
  when:
    - guarded_patch_reboot_required | bool
    - not (guarded_patch_reboot | bool)

- name: Reboot if required and explicitly enabled
  ansible.builtin.reboot:
    reboot_timeout: "{{ guarded_patch_reboot_timeout }}"
  when:
    - guarded_patch_apply | bool
    - guarded_patch_reboot | bool
    - guarded_patch_reboot_required | bool
