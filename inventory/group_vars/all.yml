---
# Shared example defaults. Override per group or host as needed.

chrony_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org

guarded_patch_apply: false
guarded_patch_reboot: false
guarded_patch_max_packages: 50
guarded_patch_allow_large_batch: false

systemd_timer_name: lab-update-check
systemd_timer_description: Weekly package-update report
systemd_timer_on_calendar: "Sun *-*-* 04:00:00"
systemd_timer_persistent: true
systemd_timer_exec_start: /usr/bin/dnf --check check-update
